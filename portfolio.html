<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio, Real Stock</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<div class="wrap">
<header id="nav"></header>
<p class="eyebrow" style="margin-top:16px">Wallet</p><h2 class="section">Your tokenized stocks</h2>
<p class="note" id="lead" style="max-width:760px;margin:8px 0 24px"></p>
<div id="pf"><div class="empty">Connect a wallet to check receipt and holdings.<div style="margin-top:16px"><button class="btn sm" onclick="connectWallet()">Connect wallet</button></div></div></div>
<footer id="foot"></footer>
</div>
<script src="app.js?v=3"></script>
<script>
mountNav("portfolio.html"); mountFooter();
document.getElementById("lead").textContent="Connect a wallet to see which "+NET.issuer+" tokenized stocks it holds on "+NET.label+", valued at each token's own Chainlink feed. Holdings without a feed are listed but not priced, and the subtotal says how many were priced. Reference value is not a liquidation quote.";
async function load(){
  const pf=document.getElementById("pf"); if(!state.wallet) return;
  pf.innerHTML='<div style="display:flex;justify-content:space-between;align-items:baseline;gap:20px;flex-wrap:wrap;border-top:1px solid var(--rule);padding:20px 0"><div><div class="eyebrow" style="margin:0">Holdings on '+esc(NET.label)+'</div><div class="meta" style="margin-top:6px">'+state.wallet+'</div></div><div class="value" id="pf_total">—</div></div><div class="tblwrap"><table><thead><tr><th>Stock</th><th class="num">Balance</th><th class="num">Reference</th><th class="num">Value</th><th class="num">24h</th><th>Policy</th><th>Trade</th></tr></thead><tbody id="pf_rows"><tr><td colspan="7" class="note">Reading balances...</td></tr></tbody></table></div></div>';
  const toks=await loadRegistry();
  const bals=await pool(toks,t=>call(t.address,SEL.balanceOf+pad(state.wallet)).then(hexToBig).catch(()=>null),8);
  const held=toks.map((t,i)=>({t,bal:bals[i]})).filter(x=>x.bal!=null&&x.bal!==0n);
  const tb=document.getElementById("pf_rows"); tb.innerHTML="";
  if(!held.length){ tb.innerHTML='<tr><td colspan="7" class="note">No supported stock tokens found on '+esc(NET.label)+'.</td></tr>'; document.getElementById("pf_total").textContent="—"; return; }
  const rows=await pool(held,x=>loadRow(x.t,false),6);
  const pols=await pool(held,(x,i)=>policyProbe(x.t.address,holderFor(rows[i].dx),state.wallet),6);
  let total=0, priced=0;
  held.forEach((x,i)=>{ const r=rows[i]; if(!r) return; const q=Number(x.bal)/10**(r.core.dec||18); const good=r.orc&&!r.orc.error&&r.orc.price>0; const v=good?q*r.orc.price:null; if(v!=null){ total+=v; priced++; }
    const p=pols[i]||{status:"unknown",detail:"n/a"}; const ptag=p.status==="ok"?'Passed':p.status==="blocked"?'<span class="warnv">Blocked</span>':'<span class="sub">Not tested</span>';
    const tr=document.createElement("tr"); tr.className="row"; tr.onclick=(e)=>{ if(e.target.closest("a")) return; location.href=withNet("check.html?q="+x.t.address); };
    tr.innerHTML='<td>'+tokenCell(r.core,x.t)+'</td><td class="num">'+fmt(q,6)+'</td><td class="num">'+(good?usd(r.orc.price):'<span class="sub">no feed</span>')+'</td><td class="num">'+(v!=null?'<b>'+usd(v)+'</b>':'<span class="sub">not priced</span>')+'</td><td class="num">'+pct(r.dx.chg)+'</td><td>'+ptag+'</td><td>'+(r.dx.price?tradeLinks(x.t,r.dx):'<span class="sub">—</span>')+'</td>';
    tb.appendChild(tr); });
  document.getElementById("pf_total").innerHTML=usd(total)+'<div class="eyebrow" style="margin:6px 0 0;text-align:right">Reference subtotal, '+priced+' of '+held.length+' priced</div>';
}
document.addEventListener("wallet",e=>{ if(e.detail) load(); else document.getElementById("pf").innerHTML='<div class="empty">Connect a wallet to check receipt and holdings.<div style="margin-top:16px"><button class="btn sm" onclick="connectWallet()">Connect wallet</button></div></div>'; });
</script>
</body>
</html>
