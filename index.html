<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Real Stock</title>
<meta name="description" content="Check whether a tokenized stock token is really issued by Coinbase or Robinhood, see the evidence, and test whether your wallet can receive it.">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<div class="wrap">
<header id="nav"></header>
<main class="main">
  <p class="eyebrow" style="margin-top:16px">Tokenized stock verification</p>
  <h1 class="display">Check the token.<br>See the evidence.</h1>

  <div style="margin-top:24px">
    <label class="lbl" for="q">Token contract address</label>
    <form class="field" id="form">
      <input id="q" placeholder="0x…" autocomplete="off">
      <button class="btn" type="submit">Check token</button>
    </form>
    <div id="err" class="note warnv" style="min-height:20px"></div>
    <div class="examples" id="examples"></div>
  </div>

  <p class="eyebrow" style="margin-top:32px">Live example</p>
  <div id="live"></div>
</main>
<footer id="foot"></footer>
</div>
<script src="app.js?v=3"></script>
<script>
mountNav("index.html"); mountFooter();
document.getElementById("form").onsubmit=(e)=>{
  e.preventDefault(); const v=document.getElementById("q").value.trim(); if(!v) return;
  if(/^0x/i.test(v)&&!/^0x[0-9a-fA-F]{40}$/.test(v)){ document.getElementById("err").textContent="Enter a complete 0x contract address."; return; }
  location.href=withNet("check.html?q="+encodeURIComponent(v));
};
// A verified example pair per network: one issuer token, one look alike from the same factory.
const EXAMPLES={base:{official:"0xb200000000000000000000C2e324d24d7eEcd1fb",fake:"0xb2000000000000000000008b79a7be3f03091001"},
                robinhood:{official:"0x05a3d1Cd21d0C88145E82600E62e7E496e0F222B",fake:"0x22fa1175ACd6898cD74112FB8BbFf7c12ACa4527"}};
const EX=EXAMPLES[NET.key];
document.getElementById("examples").innerHTML=EX?'<button class="linkbtn" data-x="official">Official token</button><button class="linkbtn" data-x="fake">Look-alike example</button>':"";
document.querySelectorAll("#examples button").forEach(b=>b.onclick=()=>render(EX[b.dataset.x]));

function skeleton(addr){
  return '<div class="meta">'+addr+'</div>'
   +'<section class="block"><p class="eyebrow">Issuer check</p><div class="vhead"><div style="width:32px">'+ICON.big.unk+'</div><div><p class="verdict">Checking issuer…</p></div></div></section>'
   +'<section class="cols"><div><p class="eyebrow">Market / reference</p><div class="value"><span class="sk" style="width:150px"></span></div></div><div><p class="eyebrow">Issuer evidence</p><div><span class="sk" style="width:220px"></span></div></div></section>';
}
async function render(addr){
  const el=document.getElementById("live");
  el.innerHTML=skeleton(addr);
  await loadRegistry();
  const reg=state.byAddr[addr.toLowerCase()];
  const r=await loadRow(reg||{address:addr},false);
  const {core,orc,dx,prem}=r;
  const good=orc&&!orc.error&&orc.price>0;
  const pass=!!reg;
  el.innerHTML='<div style="padding-bottom:16px"><h2 class="section">'+esc(core.name||"Unknown token")+'</h2><div class="meta" style="margin-top:6px">'+addr+'</div></div>'
   +'<section class="block"><p class="eyebrow">Issuer check</p><div class="vhead"><div style="width:32px">'+(pass?ICON.big.pass:ICON.big.fail)+'</div><div><p class="verdict">'+(pass?"Issuer match confirmed":"Not on the issuer list")+'</p>'
   +'<p class="sub" style="margin:12px 0 0;max-width:640px">'+(pass?("This address is published by "+NET.issuer+", and the contract fingerprint agrees."):(NET.issuer+" does not publish this address, although the contract itself is a valid "+(NET.key==="base"?"B20 token":"proxy")+"."))+'</p></div></div></section>'
   +'<section class="cols"><div><p class="eyebrow">Market / reference</p><div class="value">'+(dx.price?usd(dx.price):"—")+'</div>'
   +'<div class="small" style="margin-top:8px">'+(good?"Reference "+usd(orc.price)+' <span class="sub">as of '+ago(orc.updatedAt)+" ago</span>":'<span class="warnv">Reference unavailable</span>')+'</div>'
   +(prem!=null?'<div class="small" style="margin-top:4px">'+(prem>=0?"+":"−")+Math.abs(prem).toFixed(2)+'% versus reference</div>':'')+'</div>'
   +'<div><p class="eyebrow">Next step</p><p class="small" style="margin:0 0 12px">'+(pass?"Inspect the eight onchain checks behind this conclusion.":"See which checks failed and which look alikes exist.")+'</p><a class="btn sm" href="'+withNet("check.html?q="+addr)+'">Inspect all checks</a></div></section>';
}
loadRegistry().then(()=>{ if(EX) render(EX.official); });
</script>
</body>
</html>
