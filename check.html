<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Check, Real Stock</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<div class="wrap">
<header id="nav"></header>
<main class="main">
  <form class="field" id="form" style="margin-bottom:8px">
    <input id="q" placeholder="0x… contract address or ticker" autocomplete="off" aria-label="Token contract address">
    <button class="btn" type="submit">Check token</button>
  </form>
  <div id="err" class="note warnv" style="min-height:20px"></div>
  <div id="result" aria-live="polite"></div>
</main>
<footer id="foot"></footer>
</div>
<script src="app.js?v=3"></script>
<script>
mountNav("index.html"); mountFooter();
document.getElementById("form").onsubmit=(e)=>{
  e.preventDefault(); const v=document.getElementById("q").value.trim();
  if(!v) return;
  if(/^0x/i.test(v)&&!/^0x[0-9a-fA-F]{40}$/.test(v)){ document.getElementById("err").textContent="Enter a complete 0x contract address."; return; }
  location.href=withNet("check.html?q="+encodeURIComponent(v));
};
let current=null;

function shell(addr,reg,core){
  const id=(core&&core.name)||(reg&&reg.name)||"Unknown token";
  const sym=(core&&core.symbol)||(reg&&reg.symbol)||"";
  return '<div style="padding:8px 0 20px"><h2 class="section">'+esc(id)+'</h2>'
    +'<div class="small sub">'+(sym?esc(sym)+' · ':'')+esc(NET.label)+'</div>'
    +'<div class="meta" style="margin-top:8px">'+addr+' <button class="linkbtn" onclick="navigator.clipboard&&navigator.clipboard.writeText(\''+addr+'\');this.textContent=\'copied\'">copy</button></div></div>'
    +'<section class="block" id="vblock"><p class="eyebrow">Issuer check</p><div class="vhead"><div id="vicon" style="width:32px"></div><div><p class="verdict" id="vtext">Checking issuer…</p><p class="sub" id="vwhy" style="margin:12px 0 0;max-width:640px"></p></div></div></section>'
    +'<section class="cols"><div><p class="eyebrow">Market / reference</p><div id="pricebox"><div class="value"><span class="sk" style="width:140px"></span></div></div></div>'
    +'<div><p class="eyebrow">Wallet receipt</p><div id="recbox"><p class="section" style="font-size:24px;margin:0">Checking…</p></div></div></section>'
    +'<div id="recovery"></div>'
    +'<section id="tradebox"></section>'
    +'<details class="ev" id="evd"><summary>Inspect 8 onchain checks</summary><div id="evrows"></div></details>'
    +'<div class="meta" style="margin-top:20px" id="footmeta"></div>';
}

async function run(input){
  const box=document.getElementById("result");
  await loadRegistry();
  const addr=resolve(input);
  if(!addr){ box.innerHTML='<section class="block"><p class="eyebrow">Issuer check</p><p class="verdict">No listed token matches this search.</p><p class="sub" style="margin-top:12px">Paste a contract address to check it directly.</p></section>'; return; }
  current=addr;
  const reg=state.byAddr[addr.toLowerCase()];
  box.innerHTML=shell(addr,reg,null);
  const rows=document.getElementById("evrows");
  const names=["Issuer list membership","Contract fingerprint","Name and metadata","Corporate action multiplier","Reference price","Market price","Transfer policy","Look alike tokens"];
  rows.innerHTML=names.map((n,i)=>evrow(i+1,"pending",n,"Pending","")).join("");

  const r=await loadRow(reg||{address:addr,symbol:null,name:null,root:null},false);
  const {core,orc,dx,prem}=r;
  box.querySelector(".section").textContent=core.name||"Unknown token";
  const symRoot=(core.symbol||"").replace(/c$/i,"");
  const target=!reg&&core.symbol?(NET.tokens||[]).find(t=>(t.root||t.symbol).toUpperCase()===symRoot.toUpperCase()):null;
  const root=reg?(reg.root||reg.symbol).replace(/c$/,""):(target?(target.root||target.symbol).replace(/c$/,""):symRoot);
  const extra=reg?(reg.name||"").split(/\s+/)[0]:(target?target.name:(core.name||"").split(/\s+/)[0]);

  // verdict
  const vt=document.getElementById("vtext"), vi=document.getElementById("vicon"), vw=document.getElementById("vwhy");
  if(reg){ vt.textContent="Issuer match confirmed"; vi.innerHTML=ICON.big.pass;
    vw.textContent="This address is on "+NET.issuer+"'s published list"+(reg.isin?", ISIN "+reg.isin:"")+", and the contract fingerprint agrees."; }
  else { vt.textContent="Not on the issuer list"; vi.innerHTML=ICON.big.fail;
    vw.textContent=NET.issuer+" does not publish this address"+(target?", and it copies the ticker of "+target.symbol:"")+". That means it is not an issuer token, not that it is proven fraudulent."; }

  // official token recovery. No fuzzy ticker mapping: only suggest an issuer token whose company
  // name or ticker appears as a whole word in the candidate's own name or symbol.
  const rec=document.getElementById("recovery");
  const hay=((core.name||"")+" "+(core.symbol||"")).toLowerCase();
  const word=(w)=>new RegExp("(^|[^a-z0-9])"+w.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"([^a-z0-9]|$)").test(hay);
  const suggestions=reg?[]:(NET.tokens||[]).filter(t=>{
    const first=(t.name||"").split(/\s+/)[0];
    return (first&&first.length>2&&word(first))||word((t.root||t.symbol).replace(/c$/,""));
  }).slice(0,2);
  if(!reg&&suggestions.length){
    rec.innerHTML='<div style="border-bottom:1px solid var(--rule);padding:20px 0;display:flex;gap:20px;align-items:center;flex-wrap:wrap">'
      +'<div><div class="eyebrow" style="margin:0 0 6px">Did you mean</div><div class="small">'+NET.issuer+' issues '+suggestions.map(t=>esc(t.name)).join(" and ")+' at a different address.</div></div>'
      +'<div style="margin-left:auto;display:flex;gap:10px">'+suggestions.map(t=>'<a class="btn sm" href="'+withNet("check.html?q="+t.address)+'">Check '+esc(t.symbol)+'</a>').join("")+'</div></div>';
  } else rec.innerHTML="";

  // price column
  const pb=document.getElementById("pricebox");
  const usable=refUsable(orc);
  if(dx.price){
    pb.innerHTML='<div class="value">'+usd(dx.price)+'</div>'
      +'<div class="small" style="margin-top:8px">'+(orc&&!orc.error&&orc.price>0
          ? 'Reference '+usd(orc.price)+' <span class="sub">as of '+ago(orc.updatedAt)+' ago'+(orc.paused?', feed paused':'')+'</span>'
          : '<span class="warnv">Reference unavailable</span>')+'</div>'
      +(usable&&prem!=null
          ? '<div class="small" style="margin-top:4px">'+(prem>=0?"+":"\u2212")+Math.abs(prem).toFixed(2)+'% versus reference</div>'
          : (orc&&orc.price>0?'<div class="small warnv" style="margin-top:4px">No comparison shown: the reference is '+(orc.paused?"paused":"older than three hours")+'.</div>':''))
      +'<div class="small sub" style="margin-top:4px">'+(dx.liq?usdBig(dx.liq)+' reported liquidity on '+esc(dx.venue):'no pool')+' · '+sessionNote()+'</div>';
  } else {
    pb.innerHTML='<div class="value sub">\u2014</div><div class="small sub" style="margin-top:8px">'+(dx.quoteOnly?"This token only appears as the quote side of a pair, so no independent price can be read.":"No liquidity pool found on "+esc(NET.label))+'</div>';
  }

  const [likes,pol,pr]=await Promise.all([
    root?lookalikes(root,addr,extra):Promise.resolve([]),
    state.wallet?policyProbe(addr,holderFor(dx),state.wallet):Promise.resolve(null),
    state.wallet?policyRead(addr,state.wallet,holderFor(dx)):Promise.resolve(null)]);

  // receipt column
  const rb=document.getElementById("recbox");
  if(core.paused){ rb.innerHTML='<p class="section warnv" style="font-size:24px;margin:0">Transfers paused by the issuer</p><p class="small sub" style="margin-top:8px">No address can receive this token right now.</p>'; }
  else if(!state.wallet){ rb.innerHTML='<p class="section" style="font-size:24px;margin:0">Connect a wallet to test receipt</p><button class="btn sm" style="margin-top:12px" onclick="connectWallet()">Connect wallet</button>'; }
  else {
    const rx=pr&&pr.receiver;
    let headline="Receive simulation passed", warn=false;
    if(rx&&rx.unknownPolicy){ headline="Policy id not known to the registry"; warn=true; }
    else if(rx&&rx.ok===false){ headline="Receiver policy denies this address"; warn=true; }
    else if(pol&&pol.status==="blocked"){ headline="Transfer reverted"; warn=true; }
    else if(pol&&pol.status!=="ok"){ headline="Receipt check unavailable"; warn=true; }
    rb.innerHTML='<p class="section'+(warn?" warnv":"")+'" style="font-size:24px;margin:0">'+esc(headline)+'</p>'
      +'<div class="small sub" style="margin-top:8px">'+short(state.wallet)+' · 1 unit · current block</div>'
      +(pr?'<div class="small sub" style="margin-top:4px">policy ids receiver '+esc((rx&&rx.id)||"n/a")+', sender '+esc((pr.sender&&pr.sender.id)||"n/a")+', executor '+esc((pr.executor&&pr.executor.id)||"n/a")+'</div>':'')
      +'<div class="small sub" style="margin-top:4px">Covers this transfer only, not any particular swap route or allowance.</div>';
  }

  // evidence rows
  const metaImg=core.meta&&typeof core.meta.image==="string"?core.meta.image:null;
  function metaHost(u){ try{ const x=new URL(u); return (x.protocol==="https:"&&!x.username&&!x.password)?x.hostname.toLowerCase():null; }catch(e){ return null; } }
  const mh=metaImg?metaHost(metaImg):null;
  const metaOk=NET.verify==="b20"?(mh==="metadata.coinbase.com"):(!!core.name&&/• Robinhood Token$/.test(core.name));
  const fpOk=NET.verify==="b20"?core.isB20:core.beaconOk;
  const mult=core.multiplier, pend=core.pending;
  const good=orc&&!orc.error&&orc.price>0;
  const evs=[
    [reg?"pass":"fail","Issuer list membership",reg?"Listed":"Not listed",reg?(NET.issuer+" publishes this address"+(NET.fetchedAt?", snapshot "+esc(NET.fetchedAt):"")+(reg.chainId?", chain "+reg.chainId:"")):"Checked against "+NET.listName],
    [fpOk?"pass":"unknown","Contract fingerprint",fpOk?"Matches":"No match",
      NET.verify==="b20"
        ? (fpOk?"B20Factory recognises this token. The factory is open to anyone, so this alone does not identify the issuer."
              :"B20Factory does not recognise this address. Coinbase's tokens are always B20, so this is not one of them.")
        : (core.beaconOk?"Beacon slot "+core.beacon+", the same beacon behind every official Robinhood Stock Token."
              :(core.beacon&&/[1-9a-f]/.test(core.beacon.slice(2))?"Beacon slot "+core.beacon+", which is not Robinhood's beacon.":"No beacon slot, so this is not a Robinhood proxy."))],
    [metaOk?"pass":"unknown","Name and metadata",metaOk?"Consistent":(core.name?"Inconsistent":"Unreadable"),
      NET.verify==="b20"?(mh?"Metadata host resolves to "+esc(mh)+". Corroboration only, a URL can be copied.":(core.uri?"No parseable https metadata host.":"This address exposes no contractURI, which can mean an unavailable metadata source rather than a fake."))
                        :(core.name?esc(core.name):"This address exposes no name.")],
    [mult==null?"unknown":(pend?"unknown":"pass"),"Corporate action multiplier",mult==null?"Unreadable":mult.toFixed(6),mult==null?"This token does not expose a multiplier":"Read onchain. The reference feed already includes it."+(pend?" A change to "+pend.value.toFixed(6)+" is pending.":"")],
    [usable?"pass":"unknown","Reference price",good?usd(orc.price):"Unavailable",good?("Updated "+ago(orc.updatedAt)+" ago from the "+esc(orc.source)+(orc.paused?". The feed is paused, which happens during corporate actions.":"")):"No Chainlink feed published for this token"],
    [dx.price?"pass":"unknown","Market price",dx.price?usd(dx.price):"No pool",dx.price?("Deepest pool on "+esc(dx.venue)+" against "+esc(dx.quote)+", "+usdBig(dx.liq)+" reported liquidity"):"Nothing tradable found on "+esc(NET.label)],
    [!state.wallet?"unknown":(document.querySelector("#recbox .warnv")?"fail":"pass"),"Transfer policy",!state.wallet?"Not tested":(document.querySelector("#recbox .warnv")?"Attention":"Passed"),!state.wallet?"Connect a wallet to read the policy registry":"Read from the policy registry and confirmed by simulation"],
    [likes.length?"unknown":"pass","Look alike tokens",likes.length?String(likes.length)+" found":"None found",likes.length?likes.map(l=>'<a href="'+withNet("check.html?q="+l.addr)+'">'+esc(l.symbol)+'</a> '+usdBig(l.liq)).join(" · "):"DexScreener returns no other token using this name or ticker on "+esc(NET.label)]
  ];
  rows.innerHTML=evs.map((e,i)=>evrow(i+1,e[0],e[1],e[2],e[3])).join("");
  if(evs.some(e=>e[0]==="fail")||!reg) document.getElementById("evd").open=true;

  // trade preparation: a size specific quote for issuer listed tokens on Base
  const tb=document.getElementById("tradebox");
  if(reg&&QUOTE.supported()&&dx.price){
    tb.innerHTML='<div style="border-bottom:1px solid var(--rule);padding:24px 0">'
      +'<p class="eyebrow">Buy preview</p>'
      +'<div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">'
      +'<div><label class="lbl" for="amt">USDC amount</label><div class="field" style="width:220px"><input id="amt" value="500" inputmode="decimal" style="border-right:1px solid var(--rule);border-radius:4px;height:44px"></div></div>'
      +'<button class="btn sm" id="qbtn" style="height:44px">Get quote</button>'
      +'<a class="linkbtn" id="venue" href="'+venueUrl(addr)+'" target="_blank" rel="noopener" style="margin-left:auto">Open '+QUOTE.venue+' for a fresh quote</a>'
      +'</div><div id="qout" style="margin-top:16px" aria-live="polite"></div></div>';

    let live=null, tick=null;
    const out=()=>document.getElementById("qout");
    const wantKey=()=>{ const v=parseFloat(document.getElementById("amt").value); const amt=Math.round((v||0)*1e6);
      return [NET.key,NET.quote.toLowerCase(),addr.toLowerCase(),amt].join("|"); };
    function paint(){
      if(!live){ return; }
      const age=Math.round((Date.now()-live.at)/1000);
      const stale=age>QUOTE.staleAfter;
      const usable=refUsable(orc);
      const dev=usable?((live.perToken/orc.price-1)*100):null;
      out().innerHTML='<div class="value'+(stale?' sub':'')+'">'+fmt(live.out,6)+' <span class="small sub">'+esc(core.symbol||"")+'</span></div>'
        +'<div class="small" style="margin-top:8px">'+fmt(live.perToken,2)+' USDC per '+esc(core.symbol||"token")+' at this size'
        +(dev!=null?', '+(dev>=0?"+":"\u2212")+Math.abs(dev).toFixed(2)+'% versus the reference':'')+'</div>'
        +(dev==null?'<div class="small warnv" style="margin-top:4px">Reference '+(orc&&orc.price>0?"is "+(orc.paused?"paused":"older than three hours")+", so no comparison is shown":"unavailable")+'.</div>':'<div class="small sub" style="margin-top:4px">Comparison assumes 1 USDC = $1.</div>')
        +(live.gasUsd?'<div class="small sub" style="margin-top:4px">Estimated swap gas '+usd(live.gasUsd)+', excluding any token approval.</div>':'')
        +'<div class="small '+(stale?"warnv":"sub")+'" style="margin-top:4px">'+(stale
            ? 'Previous estimate, '+age+'s old. Refresh the quote before acting on it.'
            : 'Quoted by '+QUOTE.venue+' '+age+'s ago for this exact amount.')+'</div>'
        +'<div class="small sub" style="margin-top:4px">A quote estimate for one route at one moment, possibly spanning several liquidity sources. It is not a wallet swap simulation, and the venue will requote when you arrive.</div>';
    }
    async function run(){
      const key=wantKey();
      if(tick) clearInterval(tick);
      live=null; out().innerHTML='<span class="sk" style="width:200px"></span>';
      const v=parseFloat(document.getElementById("amt").value);
      const q=await quote(addr,v,core.dec);
      if(q.key&&q.key!==wantKey()) return;            // the input moved on, discard
      if(q.error){ out().innerHTML='<div class="small warnv">'+esc(q.error)+'</div>'; return; }
      live=q; paint(); tick=setInterval(paint,1000);
    }
    document.getElementById("qbtn").onclick=run;
    document.getElementById("amt").addEventListener("input",()=>{ if(tick) clearInterval(tick); live=null; out().innerHTML='<div class="small sub">Amount changed. Get a new quote.</div>'; });
    document.getElementById("amt").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); run(); }});
    run();
  } else tb.innerHTML="";

  document.getElementById("footmeta").innerHTML="Checked "+new Date().toISOString().slice(0,16).replace("T"," ")+" UTC · token "+addr+(reg&&reg.feed?" · feed "+reg.feed:"")+(dx.pairAddress?" · pool "+dx.pairAddress:"")+" · "+infoLinks(addr)+(dx.price?" "+tradeLinks(reg||{address:addr},dx):"");
}
document.addEventListener("wallet",()=>{ if(current) run(current); });
const q=new URLSearchParams(location.search).get("q");
loadRegistry().then(()=>{ if(q){ document.getElementById("q").value=q; run(q); } else document.getElementById("result").innerHTML='<div class="empty">Paste a contract address above to check it.</div>'; });
</script>
</body>
</html>
